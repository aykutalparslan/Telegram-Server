# Ferrite development coturn configuration.
#
# This file is a development template for the optional self-hosted STUN/TURN
# endpoint that Ferrite advertises through phoneConnectionWebrtc rows.
# Production deployments must review every value below.
#
# The REST shared secret is intentionally NOT stored in git. Provide it via
# the TURN_REST_SECRET environment variable (see docker-compose.yml) or a
# local override file; the same value goes into Ferrite's CallTurnOptions
# SharedSecret.

listening-port=3478
fingerprint

# --- REST credentials (matches Ferrite's CoturnRestCredentialProvider) ----
# username = "<unix expiry>:call<id>", password = base64(HMAC-SHA1(secret)).
use-auth-secret
# static-auth-secret is injected via the command line / environment in the
# compose fragment; do not commit a real secret here.
realm=ferrite.local

# --- External address mapping ---------------------------------------------
# Behind NAT, map the relay's private address to the public one, e.g.:
# external-ip=203.0.113.10/10.0.0.10
# The AppHost runs coturn in a container with the relay range published onto
# the host, so without this it would hand back its container-internal address
# in XOR-RELAYED-ADDRESS and host-side clients could never reach the relay.
external-ip=127.0.0.1

# --- Relay port range -------------------------------------------------------
# Keep the UDP relay range small in development and open it in the firewall.
min-port=49160
max-port=49200

# --- Peer address policy ----------------------------------------------------
# Deny relaying into link-local/multicast networks. In production also deny
# loopback and the RFC1918 ranges unless the media peers legitimately live
# there; development frequently relays between private addresses, so the
# private ranges stay allowed HERE ONLY.
#
# Loopback stays allowed HERE ONLY as well: the integration suite runs every
# client and reflector on 127.0.0.1, so denying it leaves the advertised TURN
# row unusable. tgcalls still gathers the relay candidate and spends most of
# its media window failing over it, which starves the reflector path. A
# production deployment MUST restore the loopback deny below.
no-multicast-peers
denied-peer-ip=169.254.0.0-169.254.255.255
# Production additions (uncomment when peers are public):
# denied-peer-ip=127.0.0.0-127.255.255.255
# denied-peer-ip=10.0.0.0-10.255.255.255
# denied-peer-ip=172.16.0.0-172.31.255.255
# denied-peer-ip=192.168.0.0-192.168.255.255

# --- Quotas and bandwidth ----------------------------------------------------
# One voice call needs a few dozen kbit/s; these caps bound abuse if a
# credential leaks within its TTL.
user-quota=8
total-quota=200
max-bps=500000

# --- Logging / metrics -------------------------------------------------------
# stdout logging suits containers; enable prometheus in coturn >= 4.6 builds
# that ship it if scraping is wanted.
log-file=stdout
no-cli
