name: ferrite-group-calls

services:
  ferrite:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ferrite
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      group-call-worker:
        condition: service_healthy
    environment:
      FERRITE_PUBLIC_ADDRESS: ${FERRITE_PUBLIC_ADDRESS:?set the public IPv4 address clients reach}
      FERRITE_PORT: "5222"
      FERRITE_DATA_PATH: /data
      FERRITE_GROUP_CALL_CONTROL_URL: http://group-call-worker:9090/
      FERRITE_GROUP_CALL_AUTH_SECRET: ${FERRITE_GROUP_CALL_AUTH_SECRET:?set a random secret of at least 16 characters}
      FERRITE_GROUP_CALL_REQUEST_TIMEOUT_SECONDS: "5"
      FERRITE_GROUP_CALL_HEALTH_TIMEOUT_SECONDS: "2"
      FERRITE_GROUP_CALL_HEALTH_INTERVAL_SECONDS: "5"
      FERRITE_GROUP_CALL_UNMUTED_VIDEO_LIMIT: "30"
      FERRITE_GROUP_CALL_MAX_RECORDING_BYTES: "2000000000"
      FERRITE_GROUP_CALL_RECORDING_FINALIZE_TIMEOUT_SECONDS: "120"
      FERRITE_GROUP_CALL_RECORDING_HEALTH_INTERVAL_SECONDS: "5"
      FERRITE_GROUP_CALL_RECORDING_MAX_TITLE_BYTES: "255"
    ports:
      - "${FERRITE_PORT:-5222}:5222/tcp"
    volumes:
      - ferrite-data:/data
    networks:
      - public
      - control
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5222'"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  group-call-worker:
    build:
      context: ../group-call-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      FERRITE_GROUP_CALL_AUTH_SECRET: ${FERRITE_GROUP_CALL_AUTH_SECRET:?set a random secret of at least 16 characters}
      FERRITE_GROUP_CALL_CONTROL_BIND: 0.0.0.0
      FERRITE_GROUP_CALL_CONTROL_PORT: "9090"
      FERRITE_GROUP_CALL_MEDIA_BIND: 0.0.0.0
      FERRITE_GROUP_CALL_MEDIA_ADVERTISED: ${FERRITE_GROUP_CALL_MEDIA_ADVERTISED:?set the public IPv4 address advertised by the worker}
      FERRITE_GROUP_CALL_RTC_MIN_PORT: "40000"
      FERRITE_GROUP_CALL_RTC_MAX_PORT: "40100"
      FERRITE_GROUP_CALL_MAX_ROOMS: "100"
      FERRITE_GROUP_CALL_MAX_PARTICIPANTS_PER_ROOM: "1000"
      FERRITE_GROUP_CALL_MAX_CONTROL_BODY_BYTES: "262144"
      FERRITE_GROUP_CALL_MAX_EVENT_CLIENTS: "32"
      FERRITE_GROUP_CALL_RTMP_BIND: 0.0.0.0
      FERRITE_GROUP_CALL_RTMP_ADVERTISED: ${FERRITE_GROUP_CALL_MEDIA_ADVERTISED:?set the public IPv4 address advertised by the worker}
      FERRITE_GROUP_CALL_RTMP_MIN_PORT: "19350"
      FERRITE_GROUP_CALL_RTMP_MAX_PORT: "19449"
      FERRITE_GROUP_CALL_RTP_TAP_ADDRESS: 127.0.0.1
      FERRITE_GROUP_CALL_RTP_TAP_MIN_PORT: "50000"
      FERRITE_GROUP_CALL_RTP_TAP_MAX_PORT: "50199"
      FERRITE_GROUP_CALL_SEGMENT_PATH: /segments
      FERRITE_GROUP_CALL_SEGMENT_RETENTION_MS: "300000"
      FERRITE_GROUP_CALL_MAX_SEGMENTS_PER_CALL: "4096"
      FERRITE_GROUP_CALL_MAX_SEGMENT_BYTES_PER_CALL: "536870912"
      FERRITE_GROUP_CALL_MAX_SEGMENT_BYTES: "1048576"
      FERRITE_GROUP_CALL_RECORDING_PATH: /recordings
      FERRITE_GROUP_CALL_RECORDING_TAP_MIN_PORT: "50200"
      FERRITE_GROUP_CALL_RECORDING_TAP_MAX_PORT: "50399"
      FERRITE_GROUP_CALL_MAX_RECORDINGS: "16"
      FERRITE_GROUP_CALL_MAX_RECORDING_BYTES: "2000000000"
      FERRITE_GROUP_CALL_MAX_RECORDING_DURATION_MS: "14400000"
      FERRITE_GROUP_CALL_RECORDING_SOURCE_WAIT_MS: "10000"
      FERRITE_GROUP_CALL_RECORDING_STOP_TIMEOUT_MS: "10000"
    ports:
      - "19350:19350/tcp"
      - "40000-40100:40000-40100/udp"
    tmpfs:
      - /segments:size=1g,mode=0700,uid=1000,gid=1000
    volumes:
      - group-call-recordings:/recordings
    networks:
      - public
      - control
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:9090/health',{headers:{authorization:'Bearer '+process.env.FERRITE_GROUP_CALL_AUTH_SECRET,'x-ferrite-groupcall-protocol':'1'}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G

volumes:
  ferrite-data:
  group-call-recordings:

networks:
  public:
  control:
    internal: true
