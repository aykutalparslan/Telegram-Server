name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Ferrite.sln

      - name: Build
        run: dotnet build Ferrite.sln --no-restore --configuration Release

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install worker dependencies
        run: npm ci
        working-directory: group-call-worker

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose definitions
        run: docker compose -f deploy/coturn/docker-compose.yml config --quiet
        env:
          FERRITE_TURN_SECRET: 0123456789abcdef
          TURN_REST_SECRET: 0123456789abcdef
